# Ruff config for NeuroFlow (format + lint).
line-length = 100
target-version = "py310"

[lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, C4: comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length handled by the formatter
]

[lint.per-file-ignores]
"demo.py" = ["E402"]  # matplotlib.use() must precede pyplot import
